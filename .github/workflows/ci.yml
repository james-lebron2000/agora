name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            packages/sdk/package-lock.json
            apps/relay/package-lock.json
      
      - name: Install dependencies (SDK)
        working-directory: packages/sdk
        run: npm ci

      - name: Ensure optional Rollup binary on Linux
        working-directory: packages/sdk
        run: |
          if grep -q "@rollup/rollup-linux-x64-gnu" package-lock.json; then
            npm i --no-save @rollup/rollup-linux-x64-gnu
          fi
      
      - name: Run tests
        working-directory: packages/sdk
        run: npm test
      
      - name: Build SDK
        working-directory: packages/sdk
        run: npm run build
      
      - name: Validate schemas
        run: |
          npm install -g ajv-cli
          ajv validate -s schemas/v1/envelope.schema.json -d tests/vectors/envelope.valid.json || true
      
      - name: Test relay
        working-directory: apps/relay
        run: |
          npm ci
          if npm run | grep -qE '^[[:space:]]+test'; then
            npm test
          else
            echo "No relay test script found; skipping."
          fi
